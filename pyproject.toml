[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hksop-harness"
version = "1.1.0"
description = "Polarization-aware optical graphs, breadboard layouts and four HKSOP design plugins"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
optical_layout = ["route-families.json"]
