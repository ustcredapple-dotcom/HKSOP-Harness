name: Offline acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  optical-design:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python3 tests/test_repo_hygiene.py
      - run: python3 tests/optical_graph_acceptance.py
      - run: python3 tests/pm_optics_checks.py
      - run: python3 tests/plugins_acceptance.py --offline
      - run: python3 tests/packaging_regression.py
      - run: python3 tests/showcase_acceptance.py
